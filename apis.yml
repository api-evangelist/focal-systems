aid: focal-systems
name: Focal Systems
description: >-
  Focal Systems is a San Francisco-based deep-learning company building the
  operating system for brick-and-mortar retail. Its platform combines
  proprietary shelf-mounted computer-vision cameras, real-time AI, and streaming
  data to digitize physical stores hourly — tracking on-shelf availability,
  out-of-stocks, planogram and price-tag compliance, shrink, and inventory.
  Products include Computer Vision cameras, Shelf AI, the Action Tool associate
  mobile app, and the Impact analytics dashboard, used by leading grocery and
  retail chains such as Walmart Canada to reduce waste, redeploy labor, and
  recover lost sales. Focal Systems is a Y Combinator and Uncork Capital-backed
  company and operates as an enterprise SaaS vendor; it does not publish a
  public self-serve developer API or SDK.
